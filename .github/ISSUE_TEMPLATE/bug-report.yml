name: 补丁或运行问题 / Patch or runtime bug
description: 报告可复现的安装、文本、图片、字体、启动或成就问题。Report a reproducible patch or runtime problem.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: 游戏 / Game
      description: 前面是中文圈常用名或简称，后面是完整 Steam 名称，请与游戏库核对。Chinese community name first, then the full Steam title.
      options:
        - "TDA00｜[TDA00] Muv-Luv Unlimited: THE DAY AFTER - Episode 00 REMASTERED"
        - "TDA01｜[TDA01] Muv-Luv Unlimited: THE DAY AFTER - Episode 01 REMASTERED"
        - "TDA02｜[TDA02] Muv-Luv Unlimited: THE DAY AFTER - Episode 02 REMASTERED"
        - "TDA03｜[TDA03] Muv-Luv Unlimited: THE DAY AFTER - Episode 03 REMASTERED"
        - "帝都燃烧篇｜The Imperial Capital Burns - Muv-Luv Alternative Total Eclipse"
        - "光子之花（PF）｜Muv-Luv photonflowers*"
        - "光子旋律（PM）｜Muv-Luv photonmelodies♮"
        - "君望／你所期望的永远｜Kimi ga Nozomu Eien: Enhanced Edition（制作中 / In development）"
        - "君望附加篇｜Kimi ga Nozomu Eien Enhanced Edition another episode collection+（制作中 / In development）"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: 补丁版本或源码提交 / Release tag or source commit
      description: 已发布的补丁填写版本或 Release tag；开发版本填写完整 commit SHA；君望尚未发布补丁，仅受理本项目开发版本或文档问题。Use the patch version or Release tag, or a full commit SHA for a development build.
      placeholder: 补丁的 Release tag，或开发版本／文档对应的完整 commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 出现了什么问题？ / What happened?
      description: 请写出准确错误、画面文字、章节／日期／路线，以及预期结果。Include the exact error, scene or route, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 请说明游戏是否为干净安装、是否安装其他 Mod，以及 Steam 验证后结果是否变化。State whether the game was clean and which other mods were installed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图与上下文 / Screenshots and context
      description: 尽量附完整截图与前后台词；不要上传游戏容器或完整资源。Attach screenshots and context, but do not upload game archives.
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checks
      options:
        - label: 我拥有对应游戏，并且没有上传受版权保护的游戏容器或完整资源。
          required: true
        - label: 我已填写对应的 Release 补丁版本；如报告开发版本或文档问题，已填写对应的 commit SHA。我没有把 GitHub 源码 ZIP 当作补丁包。
          required: true
